name: SonarQube

concurrency:
  group: rc-savana-sonarqube
  cancel-in-progress: false

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Non-blocking: SonarQube analysis is informational, should not block PRs
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ENABLE_PR_DECORATION: "false"
        run: |
          set -e

          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::warning::SONAR_TOKEN and SONAR_HOST_URL secrets are not configured. Skipping SonarQube analysis."
            echo "SONAR_SKIPPED=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Testing SonarQube connectivity..."
          if ! curl -f -s --max-time 10 "$SONAR_HOST_URL/api/system/status" >/dev/null 2>&1; then
            echo "::warning::Cannot connect to SonarQube at $SONAR_HOST_URL — skipping scan"
            echo "SONAR_SKIPPED=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Running SonarQube scan..."

          docker run --rm \
            -v "$PWD:/usr/src" \
            -w /usr/src \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            || {
              echo "::warning::SonarQube scan failed. See logs above."
              exit 0
            }

          echo "SONAR_DASHBOARD_URL=$SONAR_HOST_URL/dashboard?id=rc-savana" >> $GITHUB_ENV
          echo "SONAR_SKIPPED=false" >> $GITHUB_ENV

      - name: Comment PR with SonarQube Dashboard Link
        if: github.event_name == 'pull_request' && env.SONAR_SKIPPED == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- sonarqube-analysis -->
            ## 📊 SonarQube Analysis

            **🔗 [Abrir dashboard](${{ env.SONAR_DASHBOARD_URL }})**

            **Projeto:** `rc-savana`
            **Branch:** `${{ github.head_ref }}`
            **Commit:** `${{ github.sha }}`

            ---
            _Executado via GitHub Actions_
