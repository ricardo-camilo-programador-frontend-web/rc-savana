name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Validar Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # versão vem do campo packageManager do package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Executar Biome lint
        run: pnpm run lint

  typecheck:
    name: Validar Tipos (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # versão vem do campo packageManager do package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Checagem de tipos
        run: pnpm run typecheck

  test:
    name: Testes Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # versão vem do campo packageManager do package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Executar testes
        run: pnpm run test

  build:
    name: Build do Projeto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUXT_PUBLIC_PROJECT_TITLE: ""
      NUXT_PUBLIC_BASE_URL: ""
      NUXT_PUBLIC_SITE_URL: ""
      NUXT_PUBLIC_PORTFOLIO_URL: ""
      NUXT_PUBLIC_GITHUB_USERNAME: ""
      NUXT_PUBLIC_LINKEDIN_USERNAME: ""
      NUXT_PUBLIC_X_USERNAME: ""
      NUXT_PUBLIC_TWITTER_USERNAME: ""
      NUXT_PUBLIC_WORKANA_USERNAME: ""
      NUXT_PUBLIC_INSTAGRAM_USERNAME: ""
      NUXT_PUBLIC_FACEBOOK_ID: ""
      NUXT_PUBLIC_YOUTUBE_USERNAME: ""
      NUXT_PUBLIC_BUYMEACOFFEE_USERNAME: ""
      NUXT_PUBLIC_EMAIL: ""
      NUXT_PUBLIC_FIGMA_USERNAME: ""
      NUXT_PUBLIC_FIGMA_ORIGINAL_DESIGN: ""
      NUXT_PUBLIC_GTM_ID: ""
      NUXT_PUBLIC_ADSENSE_ID: ""
      NUXT_PUBLIC_COUNTER_API_KEY: ""
      NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ""
      NUXT_PUBLIC_LIVE_DEMO_VIDEO_URL: ""
      NUXT_PUBLIC_TREFLE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # versão vem do campo packageManager do package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build do projeto
        run: pnpm run build

  security:
    name: Auditoria de Seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # versão vem do campo packageManager do package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoria de vulnerabilidades
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          pnpm audit --audit-level high 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE" "$LOG_FILE" && grep -Eq "responded with 5[0-9]{2}([^0-9]|$)|error \\(5[0-9]{2}\\)" "$LOG_FILE"; then
            echo "::warning::pnpm audit falhou por erro 5xx do endpoint de auditoria da npm."
            exit 0
          fi

          exit "$status"

  sonar:
    name: Analise SonarQube
    runs-on: ubuntu-latest
    # `secrets` não é permitido em `if` de job: o token é checado no passo.
    # SonarQube é self-hosted; sem servidor acessível o job não bloqueia o CI.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # versão vem do campo packageManager do package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Run SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        run: (hash sonar-scanner 2>/dev/null && sonar-scanner) || npx --yes sonarqube-scanner
